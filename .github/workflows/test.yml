name: Test

on: [push, pull_request]

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os || 'ubuntu-latest' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { ruby: '3.1', grape: '~> 2.3.0', os: 'ubuntu-22.04' }
          - { ruby: '3.2', grape: '~> 2.3.0' }
          - { ruby: '3.2', grape: '~> 3.0.0' }
          - { ruby: '3.3', grape: '~> 2.3.0' }
          - { ruby: '3.3', grape: '~> 2.4.0' }
          - { ruby: '3.3', grape: '~> 3.0.0' }
          - { ruby: '3.3', grape: '~> 3.0' }
          - { ruby: '3.3', grape: '~> 4.0' }
          - { ruby: '3.4', grape: '~> 2.3.0' }
          - { ruby: '3.4', grape: '~> 3.0.0' }
          - { ruby: '3.4', grape: '~> 4.0' }
          - { ruby: '4.0', grape: '~> 2.3.0' }
          - { ruby: '4.0', grape: '~> 3.0.0' }
          - { ruby: '4.0', grape: '~> 4.0' }
          - { ruby: 'ruby-head', grape: '~> 4.0', experimental: true }
    name: Ruby ${{ matrix.ruby }} / Grape ${{ matrix.grape }}
    continue-on-error: ${{ matrix.experimental || false }}
    env:
      GRAPE_VERSION: ${{ matrix.grape }}
    steps:
      - uses: actions/checkout@v7
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
      - run: bundle exec rake spec
      - uses: coverallsapp/github-action@v2
        if: matrix.ruby != 'ruby-head'
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          file: coverage/lcov/grape-active_model_serializers.lcov
          format: lcov
          flag-name: test-${{ strategy.job-index }}
          parallel: true
  coverage:
    name: Finish Coveralls
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: coverallsapp/github-action@v2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          parallel-finished: true
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
      - run: bundle exec rake rubocop
